name: Bug report
description: Something in PunchList looks wrong or broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: PunchList version
      placeholder: 0.8.6+26.2
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, Litematica, and MaLiLib versions
      placeholder: 26.2, Litematica 0.28.4, MaLiLib 0.29.3
    validations:
      required: true
  - type: dropdown
    id: enclosed
    attributes:
      label: Enclosed mode at the time
      options:
        - Show
        - Hide
        - Hide (strict)
        - Not sure
    validations:
      required: true
  - type: input
    id: scale
    attributes:
      label: Schematic size and verifier selection
      description: Rough block count and how many verifier positions were selected. Performance reports need this.
      placeholder: 400k blocks, 16k verifier positions selected
    validations:
      required: false
  - type: dropdown
    id: easyplacefix
    attributes:
      label: EasyPlaceFix installed
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the relevant part of latest.log, or attach the whole file. Lines from punchlist and any stack trace are the useful part.
      render: text
    validations:
      required: false
